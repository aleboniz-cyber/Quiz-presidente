<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C'è solo un presidente!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219150;
        }
        .question {
            margin-bottom: 30px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
        .result {
            text-align: left;
            margin-top: 30px;
            font-size: 20px;
            color: #2980b9;
        }
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress {
            height: 20px;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.3s;
        }
        label {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h1>C'è solo un presidente!</h1>
    <p style="text-align:center;">Rispondi alle domande e scopri se sei pronto per guidare Lepida con stile!</p>

    <div id="startScreen" style="text-align:center;">
        <button onclick="iniziaQuiz()">Inizia il Quiz</button>
    </div>

    <form id="quizForm">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div id="questionContainer"></div>
        <button type="button" id="nextButton" onclick="mostraProssimaDomanda()">Prossima</button>
    </form>

    <div id="risultato" class="result"></div>
    <button type="button" id="retryButton" style="display:none;" onclick="ricominciaQuiz()">Ricomincia il Quiz</button>

    <script>
        const quiz = [
            { domanda: "1. Cos’è lo SPID?", risposte: ["Un Pokèmon di terza generazione.", "Una ricetta segreta della nonna.", "L’identità digitale per accedere ai servizi online.", "Un nuovo social network per chi ama le password dimenticate."], punti: [1, 2, 4, 3] },
            { domanda: "2. Cosa succede quando provi ad accedere con lo SPID e il sito è in manutenzione?", risposte: ["Esprimi un desiderio.", "Ti viene offerto un caffè di consolazione.", "Riprovi tra 5 minuti, che diventano 5 ore.", "Ti iscrivi a un corso accelerato di pazienza zen."], punti: [2, 3, 4, 1] },
            { domanda: "3. Qual è il principale sport nazionale sulla cybersicurezza in Italia?", risposte: ["L’attacco hacker simulato.", "Il ping pong tra enti.", "La corsa al ripristino del backup.", "La caccia alle password scritte sui post-it."], punti: [3, 4, 2, 1] },
            { domanda: "4. Chi è il vero nemico della cybersicurezza in Italia?", risposte: ["Gli hacker russi.", "I sistemi informatici aggiornati al 1998.", "Il collega con password '123456'.", "I virus del lunedì mattina."], punti: [3, 4, 2, 1] },
            { domanda: "5. Come si chiama l’arte di ricordare le password senza scriverle?", risposte: ["Memoria elefantiaca.", "Fantascienza pura.", "Tecnologia neuronale avanzata.", "Lo chiamano coraggio, ma è incoscienza."], punti: [3, 4, 2, 1] },
            { domanda: "6. Cos’è l’AI secondo l’italiano medio?", risposte: ["Una nuova tassa.", "Quel coso di ChatGPT.", "Una cosa che ci ruberà il lavoro, ma per ora fa la lista della spesa.", "Un software magico che risolve tutto."], punti: [1, 3, 4, 2] },
            { domanda: "7. L’identità digitale in Italia è…", risposte: ["Un’utopia romantica.", "Una cosa che usi solo per rinnovare la carta d’identità.", "Un gioco di incastri tra SPID, CIE, PIN e PEC.", "Il motivo per cui chiami tuo cugino 'che ne sa di computer'."], punti: [2, 3, 4, 1] },
            { domanda: "8. Come viene gestita la cybersicurezza nei piccoli Comuni?", risposte: ["Con antivirus del 2005.", "Con fede e copie cartacee.", "Con password tipo 'password'.", "Con il portiere che fa anche da firewall."], punti: [3, 4, 2, 1] },
            { domanda: "9. L’AI può sostituire l’uomo?", risposte: ["Solo se sa prendere il caffè al bar.", "Sì, ma poi chi lamenta che non funziona?", "No, l’AI non gestisce la suocera.", "Dipende: se deve accedere con SPID, si blocca pure lei."], punti: [2, 4, 3, 1] },
            { domanda: "10. Quando l’AI sbaglia, chi ha colpa?", risposte: ["Sempre l’utente.", "L’algoritmo? Impossibile!", "L’AI, ma non ha avvocato.", "La stampante. Sempre colpa sua."], punti: [4, 3, 2, 1] },
            { domanda: "BONUS: Qual è la principale differenza tra l'identità SPID ad uso professionale per persona fisica e quella per persona giuridica rilasciata da LepidaID?", risposte: ["L'identità per persona fisica include solo i dati personali, mentre quella per persona giuridica include anche i dati dell'organizzazione per cui si opera.", "L'identità per persona fisica è gratuita, mentre quella per persona giuridica è a pagamento.", "L'identità per persona fisica richiede il riconoscimento de visu, mentre quella per persona giuridica può essere ottenuta solo online.", "Non esiste alcuna differenza significativa tra le due; sono intercambiabili."], punti: [4, 2, 1, 0] }
        ];

        let currentQuestion = 0;
        let total = 0;

        const questionContainer = document.getElementById('questionContainer');
        const nextButton = document.getElementById('nextButton');
        const progressBar = document.getElementById('progress');

        function iniziaQuiz() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizForm').style.display = 'block';
            currentQuestion = 0;
            total = 0;
            nextButton.innerText = 'Prossima';
            mostraProssimaDomanda();
        }

        function mostraProssimaDomanda() {
            if (currentQuestion > 0) {
                const selected = document.querySelector('input[name="q' + (currentQuestion - 1) + '"]:checked');
                if (selected) {
                    total += parseInt(selected.value);
                } else {
                    alert('Per favore, seleziona una risposta prima di proseguire.');
                    return;
                }
            }

            if (currentQuestion < quiz.length) {
                questionContainer.innerHTML = '';
                const q = quiz[currentQuestion];
                const div = document.createElement('div');
                div.className = 'question';
                div.innerHTML = `<p>${q.domanda}</p>`;
                q.risposte.forEach((r, j) => {
                    div.innerHTML += `<label><input type="radio" name="q${currentQuestion}" value="${q.punti[j]}"> ✅ ${r}</label><br>`;
                });
                questionContainer.appendChild(div);

                currentQuestion++;

                progressBar.style.width = ((currentQuestion / quiz.length) * 100) + '%';

                if (currentQuestion === quiz.length) {
                    nextButton.innerText = 'Vedi Risultato';
                }
            } else {
                mostraRisultato();
            }
        }

        function mostraRisultato() {
            let messaggio = '';

            if (total <= 20) {
                messaggio = "Grande! Sei perfetto per fare il presidente di Lepida!<br><br>" +
                    "Ti piace improvvisare e affrontare la tecnologia con leggerezza. Il tuo motto è 'vediamo se funziona'. Ti muovi tra SPID e PEC con la naturalezza di chi sa che ogni clic è un’avventura. Non ti preoccupi di password dimenticate o portali in manutenzione: alla fine qualcosa succede sempre. Con il tuo spirito, ogni crisi digitale diventa una risata.";
            } else if (total <= 30) {
                messaggio = "Grande! Sei perfetto per fare il presidente di Lepida!<br><br>" +
                    "Sei uno stratega del caos digitale. Sai dove cliccare anche quando nemmeno gli sviluppatori sanno come risolvere. Tra moduli online e sistemi bloccati riesci a trovare sempre una via di fuga. Conosci i trucchi per schivare gli errori, sopravvivere ai crash e persino far ripartire una stampante con il solo potere dello sguardo.";
            } else {
                messaggio = "Grande! Sei perfetto per fare il presidente di Lepida!<br><br>" +
                    "Nato per dominare la burocrazia digitale. Non ti spaventa nessuna schermata rossa, nessun codice di errore e nessuna richiesta di 'verifica l’identità'. Conosci ogni scorciatoia, ogni regola, ogni aggiornamento di sistema. Potresti insegnare l’arte del click perfetto anche all’intelligenza artificiale. Ti aspettiamo in prima linea: il portale ha bisogno di te.";
            }

            document.getElementById('quizForm').style.display = 'none';
            document.getElementById('risultato').innerHTML = '<div>' + messaggio + '</div>';
            document.getElementById('retryButton').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function ricominciaQuiz() {
            currentQuestion = 0;
            total = 0;
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('quizForm').style.display = 'none';
            document.getElementById('risultato').innerHTML = '';
            document.getElementById('retryButton').style.display = 'none';
            nextButton.innerText = 'Prossima';
            progressBar.style.width = '0%';
        }
    </script>

</body>
</html>
